<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>IB Project Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy control-room sidebar + light working canvas of cards; summary tiles first, detail below. Documents render as white A4 paper. */
:root{
  --bg:#edf1f7; --surface:#ffffff; --surface-2:#f4f7fb; --line:#dfe6f0;
  --fg:#13203a; --muted:#5a6a84; --accent:#1c5fd0; --accent-soft:#c9dcfa;
  --nav:#0a2959; --nav-2:#0f3570; --nav-fg:#d5e2f6; --nav-muted:#8fa6cc;
  --good:#2b9a55; --good-soft:#dcf2e4; --warn:#e8862a; --warn-soft:#fde9d6;
  --bad:#d23a3a; --bad-soft:#fbdfdf; --violet:#7744c2; --grey:#b3bdcc; --progress-soft:#dce8fb;
  --cust:#0f7a6b; --cust-soft:#d7f0ec; --desk:#dde3ec;
  --shadow:0 1px 2px rgba(19,32,58,.06),0 4px 14px rgba(19,32,58,.05);
  --display:"Outfit","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Noto Sans Devanagari","Nirmala UI","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1322; --surface:#121d32; --surface-2:#18253e; --line:#25334e;
  --fg:#e6ecf6; --muted:#9aa8c0; --accent:#5a92ef; --accent-soft:#25467a;
  --nav:#070f1e; --nav-2:#122444; --nav-fg:#cbd8ee; --nav-muted:#7488aa;
  --good:#47c077; --good-soft:#163a27; --warn:#f29d4c; --warn-soft:#3f2a15;
  --bad:#ef6464; --bad-soft:#421c1f; --violet:#a47ce8; --grey:#56647c; --progress-soft:#1c3157;
  --cust:#43c2ae; --cust-soft:#123a35; --desk:#0e1729;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1322; --surface:#121d32; --surface-2:#18253e; --line:#25334e;
  --fg:#e6ecf6; --muted:#9aa8c0; --accent:#5a92ef; --accent-soft:#25467a;
  --nav:#070f1e; --nav-2:#122444; --nav-fg:#cbd8ee; --nav-muted:#7488aa;
  --good:#47c077; --good-soft:#163a27; --warn:#f29d4c; --warn-soft:#3f2a15;
  --bad:#ef6464; --bad-soft:#421c1f; --violet:#a47ce8; --grey:#56647c; --progress-soft:#1c3157;
  --cust:#43c2ae; --cust-soft:#123a35; --desk:#0e1729;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--nav),var(--nav-2));color:var(--nav-fg)}
.side-in{padding:18px 14px 18px max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.mono{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;color:#fff;background:conic-gradient(from 210deg,var(--accent),#3b82f6 60%,var(--accent));box-shadow:inset 0 0 0 3px rgba(255,255,255,.16);flex:none}
.brand small{display:block;color:var(--nav-muted);font-size:12px}
.brand b{font-family:var(--display);font-size:15px;color:#fff}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--nav-fg);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a svg{width:18px;height:18px;flex:none;opacity:.9}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a[aria-current="page"]{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(28,95,208,.35)}
.nav a:focus-visible{outline:2px solid #fff;outline-offset:2px}
.side-foot{margin-top:auto;font-size:12px;color:var(--nav-muted);padding:0 8px}
.main{min-width:0;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.main{padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-bottom:14px}
.top .titles{flex:1 1 320px;min-width:0}
.top h1{font-size:clamp(22px,2.5vw,31px);font-weight:700}
.top .sub{color:var(--muted);font-size:15px;margin-top:2px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.datebox{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.datebox b{display:block;color:var(--fg);font-size:14px;font-weight:600}
.datebox svg{width:22px;height:22px;color:var(--accent)}
.statusbox{border:1px solid rgba(255,255,255,.1);background:var(--nav);color:#fff;border-radius:10px;padding:9px 16px 9px 14px;display:flex;align-items:center;gap:10px;min-width:150px}
.statusbox small{display:block;color:var(--nav-muted);font-size:11.5px}
.statusbox b{font-family:var(--display);font-size:16px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button.cust[aria-pressed="true"]{background:var(--cust)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.langpick{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 4px 3px 10px;color:var(--muted)}
.langpick svg{width:16px;height:16px}
.langpick select{border:0;background:transparent;padding:6px 6px;font-weight:600;font-size:13px;color:var(--fg);cursor:pointer}
.langpick select:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.controls .spacer{flex:1}
.savebar{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.dirty{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.cust{background:var(--cust-soft);color:var(--cust);border-color:transparent}
.banner{display:flex;gap:10px;align-items:center;background:var(--cust-soft);color:var(--fg);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.banner svg{width:20px;height:20px;color:var(--cust);flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-weight:600;font-size:12.5px}
.icon-btn:hover{background:var(--surface-2);color:var(--accent)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(178px,1fr));margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h2{font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px}
.card h2 svg{width:22px;height:22px;color:var(--accent);flex:none}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi{display:flex;gap:12px;align-items:flex-start}
.kpi .ic{width:34px;height:34px;color:var(--accent);flex:none}
.kpi .ic.round{border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--display);font-size:16px}
.kpi .lbl{font-weight:600;font-size:13.5px}
.kpi .val{font-family:var(--display);font-weight:700;font-size:clamp(21px,1.8vw,29px);line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .val.md{font-size:18px;line-height:1.3}
.kpi .note{color:var(--muted);font-size:12px}
.kpi .body{min-width:0;flex:1}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.bar i.blue{background:var(--accent)}
.bar i.warn{background:var(--warn)}
.bar i.bad{background:var(--bad)}
.row2{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);margin-bottom:14px}
.row3{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr);margin-bottom:14px}
.row-tt{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}
.cols2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));margin-bottom:14px}
@media (max-width:1180px){.row2,.row-tt{grid-template-columns:minmax(0,1fr)}.row3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}}
svg text{font-family:var(--body)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.sw.sq{border-radius:3px;width:18px;height:10px}
.sw.dia{width:10px;height:10px;transform:rotate(45deg);border-radius:1px}
.sw.ln{width:18px;height:3px;border-radius:2px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-wrap svg{width:150px;height:150px;flex:none}
.dl{display:grid;grid-template-columns:auto 1fr auto;gap:9px 10px;align-items:center;font-size:13.5px;flex:1;min-width:180px}
.dl .v{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--fg);background:var(--surface-2);padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,td.nw{white-space:nowrap}
tr.total td{font-weight:700;border-top:2px solid var(--fg);background:var(--surface-2)}
tbody tr:hover td{background:var(--surface-2)}
tr.clickable{cursor:pointer}
.pbar{display:flex;align-items:center;gap:8px;min-width:130px}
.pbar .bar{flex:1;margin:0;height:12px;border-radius:3px}
.pbar .bar i{border-radius:2px}
.pbar span{width:42px;text-align:right;font-variant-numeric:tabular-nums}
.st{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:5px;white-space:nowrap}
.st.done{background:var(--good-soft);color:var(--good)}
.st.prog{background:var(--progress-soft);color:var(--accent)}
.st.not{background:var(--warn-soft);color:var(--warn)}
.st.blocked,.st.over{background:var(--bad-soft);color:var(--bad)}
.st.cust{background:var(--cust-soft);color:var(--cust)}
.st.muted{background:var(--surface-2);color:var(--muted)}
.st.over{margin-left:4px}
.sev{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.insights{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.insights li{display:flex;gap:12px;align-items:flex-start}
.insights svg{width:22px;height:22px;flex:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input,.toolbar select,.field input,.field select,.field textarea,.inline-input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.toolbar input:focus,.toolbar select:focus,.field :is(input,select,textarea):focus,.inline-input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.view{display:none}.view.on{display:block}
.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.section-title h2{font-size:22px}
.section-title p{margin:2px 0 0;color:var(--muted);font-size:13px}
.note-box{background:var(--progress-soft);color:var(--fg);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.metric{background:var(--surface-2);border-radius:10px;padding:11px 13px}
.metric small{color:var(--muted);display:block;font-size:12px}
.metric b{font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums}
.metric em{font-style:normal;font-size:11.5px;color:var(--muted);display:block}
.good{color:var(--good)}.bad{color:var(--bad)}.warnc{color:var(--warn)}
.headline{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:14px}
.headline .card small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.headline .card b{display:block;font-family:var(--display);font-size:clamp(22px,2vw,28px);font-variant-numeric:tabular-nums;margin-top:4px}
.headline .card span{font-size:12.5px;color:var(--muted)}
.consume{position:relative;height:26px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:visible;margin:28px 0 30px}
.consume .fill{position:absolute;inset:0 auto 0 0;background:var(--warn);border-radius:6px 0 0 6px}
.consume .mk{position:absolute;top:-8px;bottom:-8px;width:2px}
.consume .mk span{position:absolute;white-space:nowrap;font-size:11.5px;font-weight:600;transform:translateX(-50%)}
.consume .mk.pv{background:var(--accent)}.consume .mk.pv span{top:-18px;color:var(--accent)}
.consume .mk.ev{background:var(--good)}.consume .mk.ev span{bottom:-20px;color:var(--good)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
/* Documents */
.doc-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;align-items:end}
.doc-tools .field label{font-size:12px}
.doc-actions{display:flex;flex-wrap:wrap;gap:8px}
.desk{background:var(--desk);border-radius:12px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:18px;min-height:300px}
.desk canvas{width:100%;max-width:794px;height:auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);border-radius:2px}
.desk .wait{color:var(--muted);padding:40px 0}
.gen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.gen{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.gen h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.gen h3 svg{width:20px;height:20px;color:var(--accent);flex:none}
.gen p{margin:0;color:var(--muted);font-size:12.5px;flex:1}
/* AI */
.chat{display:flex;flex-direction:column;gap:12px;max-height:56vh;overflow:auto;padding:4px 2px 8px}
.msg{max-width:min(720px,92%);padding:10px 14px;border-radius:12px;line-height:1.55;white-space:normal}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.bot ul{margin:4px 0;padding-left:20px}
.msg.bot p{margin:0 0 6px}
.msg .edit{display:block;margin-top:6px;font-size:12px;color:var(--good);font-weight:600}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.composer textarea{flex:1;min-height:52px;max-height:160px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.composer textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.prompts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.prompts button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:500}
.prompts button:hover{border-color:var(--accent);color:var(--accent)}
/* Dialog */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--fg);width:min(580px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(8,16,32,.45)}
.dlg-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dlg-head h3{font-size:18px}
.dlg-body{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;max-height:65vh;overflow:auto}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field.check{flex-direction:row;align-items:center;gap:8px}
.field .hint{font-size:11.5px;color:var(--muted)}
.dlg-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-foot .spacer{flex:1}
.err{color:var(--bad);font-size:12.5px;grid-column:1/-1;min-height:1em}
@media (max-width:520px){.dlg-body{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px);z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .side-in{position:static;height:auto;flex-direction:row;align-items:center;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));gap:10px;overflow:hidden}
  .brand div{display:none}
  .mono{width:36px;height:36px;font-size:14px}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:8px 10px}
  .side-foot{display:none}
}
</style>

<div class="app">
  <aside class="side"><div class="side-in">
    <div class="brand"><span class="mono" id="mono">IB</span><div><b id="brandName">IB</b><small id="brandSub">Project control</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>

function metrics(){
  const sd = statusDate(), T = S.tasks;
  const totalDur = T.reduce((s,x) => s + dur(x), 0) || 1;
  const actualPct = T.reduce((s,x) => s + dur(x)*x.pct, 0) / totalDur;
  const plannedPctAt = d => T.reduce((s,x) => s + dur(x)*plannedFrac(x, d), 0) / totalDur * 100;
  const plannedPct = plannedPctAt(sd);
  const BAC = T.reduce((s,x) => s + (+x.cost||0), 0);
  const EV = T.reduce((s,x) => s + (+x.cost||0)*x.pct/100, 0);
  const PVat = d => T.reduce((s,x) => s + (+x.cost||0)*plannedFrac(x, d), 0);
  const PV = PVat(sd);
  const AC = T.reduce((s,x) => s + (+x.actual||0), 0);
  const SPI = PV > BAC*0.02 ? EV/PV : 1, CPI = AC > BAC*0.01 ? EV/AC : 1;
  const budget = +S.project.budget || BAC;
  const EAC = CPI ? BAC / CPI : BAC;
  const ETC = Math.max(0, EAC - AC), VAC = budget - EAC;
  const TCPI = (budget - AC) ? (BAC - EV) / (budget - AC) : 0;
  const counts = {Completed:0,'In Progress':0,'Not Started':0,Blocked:0};
  T.forEach(x => counts[statusOf(x)]++);
  const overdue = sortById(T.filter(x => isOverdue(x, sd)));
  const work = {}; S.owners.forEach(o => work[o] = 0);
  T.forEach(x => { work[x.owner] = (work[x.owner]||0) + dur(x)*(1 - x.pct/100); });
  const workTotal = Object.values(work).reduce((a,b) => a+b, 0);
  const ms = S.milestones.slice().sort((a,b) => D(a.date)-D(b.date));
  const nextMs = ms.find(m => D(m.date) >= D(sd)) || null;
  const worst = Math.min(SPI, CPI);
  const healthKey = worst >= 0.95 ? 'On Track' : worst >= 0.85 ? 'At Risk' : 'Off Track';
  const healthCol = {'On Track':'var(--good)','At Risk':'var(--warn)','Off Track':'var(--bad)'}[healthKey];
  const spentPct = budget ? AC/budget*100 : 0;
  return {sd,totalDur,actualPct,plannedPct,plannedPctAt,BAC,EV,PV,PVat,AC,SPI,CPI,EAC,ETC,VAC,TCPI,budget,counts,overdue,work,workTotal,nextMs,healthKey,healthCol,ms,spentPct};
}
function phaseAgg(){

    const ts = S.tasks.filter(x => x.phase === p.id);
    if (!ts.length) return {...p, empty:true, idx:i, cost:0, actual:0, ev:0, pct:0, tasks:[]};
    const start = ts.reduce((m,x) => x.start < m ? x.start : m, ts[0].start);
    const end = ts.reduce((m,x) => x.end > m ? x.end : m, ts[0].end);
    const td = ts.reduce((s,x) => s + dur(x), 0);
    const pct = ts.reduce((s,x) => s + dur(x)*x.pct, 0) / td;
    const blocked = ts.some(x => x.blocked && x.pct < 100);

    const cost = ts.reduce((s,x)=>s+(+x.cost||0),0), actual = ts.reduce((s,x)=>s+(+x.actual||0),0), ev = ts.reduce((s,x)=>s+(+x.cost||0)*x.pct/100,0);
    return {...p, idx:i, start, end, pct, st, over: pct < 100 && D(end) < D(sd), tasks: ts, cost, actual, ev};
  });
}

function smoothPath(pts){
  if (pts.length < 2) return pts.length ? `M${pts[0][0]},${pts[0][1]}` : '';
  const n = pts.length, x = pts.map(p=>p[0]), y = pts.map(p=>p[1]), dx=[], m=[], tg=[];
  for (let i=0;i<n-1;i++){ dx[i] = x[i+1]-x[i] || 1e-6; m[i] = (y[i+1]-y[i])/dx[i]; }
  tg[0] = m[0]; tg[n-1] = m[n-2];
  for (let i=1;i<n-1;i++) tg[i] = m[i-1]*m[i] <= 0 ? 0 : (m[i-1]+m[i])/2;
  for (let i=0;i<n-1;i++){
    if (m[i] === 0){ tg[i] = 0; tg[i+1] = 0; continue; }
    const a = tg[i]/m[i], b = tg[i+1]/m[i], s = a*a + b*b;
    if (s > 9){ const k = 3/Math.sqrt(s); tg[i] = k*a*m[i]; tg[i+1] = k*b*m[i]; }
  }
  let d = `M${x[0].toFixed(1)},${y[0].toFixed(1)}`;
  for (let i=0;i<n-1;i++){ const h = dx[i]/3; d += ` C${(x[i]+h).toFixed(1)},${(y[i]+tg[i]*h).toFixed(1)} ${(x[i+1]-h).toFixed(1)},${(y[i+1]-tg[i+1]*h).toFixed(1)} ${x[i+1].toFixed(1)},${y[i+1].toFixed(1)}`; }
  return d;
}
function weekTicks(){

  return out;
}
function niceStep(v){ const p = Math.pow(10, Math.floor(Math.log10(v||1))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }

function gantt(rows, opts = {}){
  const rowH = 28, headH = 30, foot = 30, idW = 40, nameW = opts.nameW || 170, W = opts.width || 760;

  s -= 2*DAY; e += 3*DAY;

  const H = headH + rows.length*rowH + foot;
  let g = `<rect x="0" y="0" width="${W}" height="${headH}" style="fill:var(--surface-2)"/>
    <text x="8" y="19" font-size="12" font-weight="600" fill="var(--fg)">ID</text><text x="${idW+4}" y="19" font-size="12" font-weight="600" fill="var(--fg)">${esc(t('Task name'))}</text>`;
  let m = new Date(s); m = Date.UTC(m.getUTCFullYear(), m.getUTCMonth(), 1);

    const xa = X(Math.max(m, s)), xb = X(Math.min(nm, e));
    g += `<line x1="${xa}" x2="${xa}" y1="0" y2="${H-foot}" stroke="var(--line)"/>`;
    if (xb - xa > 30) g += `<text x="${(xa+xb)/2}" y="19" text-anchor="middle" font-size="12" font-weight="600" fill="var(--fg)">${esc(U.month(m))}</text>`;
    m = nm;

  for (let x = D(S.project.start); x <= e; x += 7*DAY) g += `<line x1="${X(x)}" x2="${X(x)}" y1="${headH}" y2="${H-foot}" stroke="var(--line)" stroke-dasharray="1 4"/>`;
  g += `<line x1="${tl0-4}" x2="${tl0-4}" y1="0" y2="${H-foot}" stroke="var(--line)"/><line x1="${idW}" x2="${idW}" y1="0" y2="${H-foot}" stroke="var(--line)"/>`;
  const pos = {};
  rows.forEach((r,i) => {
    const y = headH + i*rowH;
    g += `<line x1="0" x2="${W}" y1="${y+rowH}" y2="${y+rowH}" stroke="var(--line)"/>`;
    g += `<text x="8" y="${y+18}" font-size="12" fill="var(--fg)">${esc(r.id)}</text><text x="${idW+4}" y="${y+18}" font-size="12" fill="var(--fg)" ${r.bold?'font-weight="600"':''}>${esc(trunc(r.label, Math.floor(nameW/6.4)))}</text>`;
    if (!r.start) return;

    g += `<rect x="${xs}" y="${y+8}" width="${w}" height="12" rx="2" style="fill:var(--accent-soft)"><title>${esc(r.label)}: ${esc(fmt(r.start))} – ${esc(fmt(r.end))} (${esc(U.pct(r.pct))})</title></rect>`;
    if (r.pct > 0) g += `<rect x="${xs}" y="${y+8}" width="${w*r.pct/100}" height="12" rx="2" style="fill:var(--accent)"/>`;
    pos[r.id] = {xs, xe, y: y+14};
    (r.milestones||[]).forEach(ms => { const mx = X(D(ms.date) + DAY/2); g += `<rect x="${mx-6}" y="${y+8}" width="12" height="12" transform="rotate(45 ${mx} ${y+14})" style="fill:var(--warn);stroke:var(--surface)" stroke-width="1.5"><title>${esc(ms.name)} · ${esc(fmt(ms.date))}</title></rect>`; });
  });
  rows.forEach(r => {

    g += `<path d="M${a.xe},${a.y} H${a.xe + 6} V${b.y} H${b.xs - 1}" fill="none" style="stroke:var(--muted)" stroke-width="1.1" marker-end="url(#arr)"/>`;

  if (sdx > tl0 && sdx < tl1) g += `<line x1="${sdx}" x2="${sdx}" y1="${headH}" y2="${H-foot+4}" style="stroke:var(--bad)" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="${sdx-lw/2}" y="${H-foot+4}" width="${lw}" height="22" rx="5" style="fill:var(--bad)"/><text x="${sdx}" y="${H-foot+19}" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">${esc(lab)}</text>`;
  return `<div class="scroll-x"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W, 620)}px" role="img" aria-label="${esc(t('Gantt Chart'))}"><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" style="fill:var(--muted)"/></marker></defs>${g}</svg></div>`;
}

/* ================= risks ================= */
function renderRisks(){
  const order = r => (r.status === 'Closed' ? 100 : 0) - sevScore(r);
  const rows = S.risks.slice().sort((a,b) => order(a) - order(b));
  const open = S.risks.filter(r => r.status !== 'Closed');
  const cell = (p,i) => { const n = open.filter(r => r.probability === p && r.impact === i).length; const s = LVL[p]*LVL[i]; const col = s >= 6 ? 'var(--bad-soft)' : s >= 3 ? 'var(--warn-soft)' : 'var(--good-soft)'; return `<td style="background:${col};text-align:center;font-weight:700;font-size:16px;width:70px;height:46px">${n || ''}</td>`; };
  const stc = r => r.status === 'Closed' ? 'done' : r.status === 'Mitigating' ? 'prog' : 'not';
  $('#v-risks').innerHTML = `
  <div class="section-title"><h2>${esc(t('Risks & Issues'))}</h2><div class="toolbar"><button class="btn" data-dl="risks-xlsx">${I.sheet}${esc(t('Excel'))}</button><button class="btn primary" data-act="addRisk">${I.plus}${esc(t('Add risk or issue'))}</button></div></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));margin-bottom:14px">
    <div class="card"><div class="card-head"><h2>${esc(t('Open items'))}</h2></div><div class="metric-grid">
      <div class="metric"><small>${esc(t('Open risks'))}</small><b>${open.filter(r=>r.kind==='Risk').length}</b></div>
      <div class="metric"><small>${esc(t('Open issues'))}</small><b class="${open.some(r=>r.kind==='Issue')?'bad':''}">${open.filter(r=>r.kind==='Issue').length}</b></div>
      <div class="metric"><small>${esc(t('High severity'))}</small><b class="${open.some(r=>sevScore(r)>=6)?'bad':''}">${open.filter(r=>sevScore(r)>=6).length}</b></div>
      <div class="metric"><small>${esc(t('Shared with customer'))}</small><b>${customerRisks().length}</b></div>
    </div></div>
    <div class="card"><div class="card-head"><h2>${esc(t('Heat map (open items)'))}</h2></div><div class="scroll-x"><table style="width:auto"><thead><tr><th>${esc(t('Probability ↓ / Impact →'))}</th><th>${esc(t('Low'))}</th><th>${esc(t('Medium'))}</th><th>${esc(t('High'))}</th></tr></thead><tbody>
      ${['High','Medium','Low'].map(p => `<tr><th style="background:transparent">${esc(t(p))}</th>${['Low','Medium','High'].map(i => cell(p,i)).join('')}</tr>`).join('')}

/* ================= document model ================= */
function isoWeekTag(s){ const d = new Date(D(s)); const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day + 3); const y = d.getUTCFullYear(); const w1 = new Date(Date.UTC(y,0,4)); const w = 1 + Math.round(((d - w1)/DAY - 3 + ((w1.getUTCDay()+6)%7)) / 7); return `${y}-W${String(w).padStart(2,'0')}`; }
const slug = s => String(s || 'project').normalize('NFKD').replace(/[^\w]+/g, '_').replace(/^_|_$/g,'').slice(0, 40) || 'project';
function msStatus(m, P, sd){ const ph = P.find(p => p.id === m.phase); const done = ph && ph.pct >= 100; if (D(m.date) < D(sd)) return done ? ['Achieved','good'] : ['Late','bad']; if (done) return ['Achieved','good']; const n = days(sd, m.date); return n <= 7 ? ['Due soon','warn'] : ['Upcoming','info']; }

function buildDoc(kind, l, aud){
  const R = F(l), T = R.t, M = metrics(), P = phaseAgg().filter(p => !p.empty), p = S.project, sd = M.sd, cust = aud === 'customer';
  const kindCode = {status:'PSR', finance:'FIN', technical:'TDS'}[kind];
  const ref = `${initials()}-${kindCode}-${isoWeekTag(sd)}`;
  const titles = {status:'Weekly status report', finance:'Financial summary', technical:'Technical documentation'};
  const from = iso(Math.max(D(p.start), D(sd) - 6*DAY));
  const meta = {
    kind, l, aud, ref, title: p.name, subtitle: T(titles[kind]), docType: T(titles[kind]),
    customer: p.customer, initials: initials(), brandSub: T('Project control'),
    classification: kind === 'technical' ? T('Internal') : cust ? T('Customer copy') : T('Internal — Confidential'),
    confidential: !cust, generated: R.date(todayIso()), pageTpl: T('Page {i} of {n}'), genTpl: T('Generated {d}', {d: R.date(todayIso())}),
    fields: kind === 'technical'
      ? [[T('Customer'), p.customer], [T('Version'), `2.0 · ${R.date(sd)}`], [T('Prepared by'), p.preparedBy || T('Project team')], [T('Reference'), ref]]
      : [[T('Customer'), p.customer], [T('Reporting period'), `${R.dateS(from)} – ${R.date(sd)}`], [T('Prepared by'), p.preparedBy || T('Project team')], [T('Project period'), `${R.date(p.start)} – ${R.date(p.end)}`], [T('Status date'), R.date(sd)], [T('Reference'), ref]],
    filename: `${slug(p.customer)}_${slug(titles[kind])}_${cust ? 'customer' : 'internal'}_${l}_${sd}`
  };
  const B = [];
  const tone = v => v >= .95 ? 'good' : v >= .85 ? 'warn' : 'bad';
  const sevChip = r => { const s = sevScore(r); return {chip: s >= 6 ? T('High') : s >= 3 ? T('Medium') : T('Low'), tone: s >= 6 ? 'bad' : s >= 3 ? 'warn' : 'good'}; };
  const showForecast = !cust || p.disclosure.forecast, showCats = !cust || p.disclosure.categories, showRisks = !cust || p.disclosure.risks;
  const risksFor = cust ? customerRisks() : S.risks.filter(r => r.status !== 'Closed').sort((a,b) => sevScore(b) - sevScore(a));
  const note = cust ? T('Figures are summary totals as at {d}. Detailed cost records are held by the project team and are available on request where the contract requires it.', {d:R.date(sd)})
                    : T('Figures are calculated from the project tracker at the status date. Reconcile costs with the finance ledger before formal or external use.');
  let n = 0; const H = txt => B.push({type:'h', text: `${++n}. ${txt}`});

  if (kind === 'status'){
    const hi = risksFor.filter(r => sevScore(r) >= 6).length;
    const sched = M.SPI >= .95 ? T('On schedule') : M.SPI >= .85 ? T('Slightly behind') : T('Behind schedule');
    const bud = M.CPI >= .95 && M.AC <= M.budget ? T('Within budget') : M.CPI >= .85 ? T('Watch spending') : T('Over budget');
    B.push({type:'rag', items:[
      {label:T('Overall'), status:{'On Track':'good','At Risk':'warn','Off Track':'bad'}[M.healthKey], text:T(M.healthKey)},
      {label:T('Schedule'), status:tone(M.SPI), text:sched},
      {label:T('Budget'), status:M.AC > M.budget ? 'bad' : tone(M.CPI), text:bud},
      {label:T('Risks'), status: hi === 0 ? 'good' : hi === 1 ? 'warn' : 'bad', text: hi === 0 ? T('No high risks') : T(hi === 1 ? '1 high risk' : '{n} high risks', {n:hi})}
    ]});
    H(T('Executive summary'));
    let sum = T('{p} is {s} as at {d}. Work is {a} complete against {pl} planned.', {p:p.name, s:T(M.healthKey).toLowerCase(), d:R.date(sd), a:R.pct(M.actualPct), pl:R.pct(M.plannedPct)}) + ' ';
    sum += T('{sp} of the {b} budget has been spent ({pc}), leaving {r}.', {sp:R.money(M.AC), b:R.money(M.budget), pc:R.pct(M.spentPct), r:R.money(M.budget - M.AC)});
    if (M.nextMs) sum += ' ' + T('The next milestone, {m}, is due on {d}.', {m:M.nextMs.name, d:R.date(M.nextMs.date)});
    if (M.overdue.length) sum += ' ' + T(cust ? (M.overdue.length === 1 ? '1 activity is behind its planned date and has a recovery action.' : '{n} activities are behind their planned dates and have recovery actions.') : (M.overdue.length === 1 ? '1 task is overdue and needs attention.' : '{n} tasks are overdue and need attention.'), {n:M.overdue.length});
    B.push({type:'p', text:sum});

function docText(doc){
  const L = [doc.meta.subtitle.toUpperCase(), doc.meta.title, ...doc.meta.fields.map(([a,b]) => `${a}: ${b}`), doc.meta.classification, ''];
  const cellTxt = c => c == null ? '' : typeof c === 'string' ? c : c.text != null ? c.text : c.chip != null ? c.chip : '';
  doc.blocks.forEach(b => {
    if (b.type === 'h') L.push('', b.text.toUpperCase());
    else if (b.type === 'p' || b.type === 'note') L.push(b.text);
    else if (b.type === 'rag') L.push(b.items.map(i => `${i.label}: ${i.text}`).join(' | '));
    else if (b.type === 'kpis') b.items.forEach(i => L.push(`- ${i.label}: ${i.value}${i.sub ? ` (${i.sub})` : ''}`));
    else if (b.type === 'bullets') b.items.forEach(i => L.push(`- ${i}`));
    else if (b.type === 'table'){ L.push(b.cols.map(c => c.label).join(' | ')); b.rows.forEach(r => L.push(r.map(cellTxt).join(' | '))); if (b.total) L.push(b.total.map(cellTxt).join(' | ')); }
  });
  return L.join('\n');
}

/* ================= canvas renderer ================= */
const PG = {w:794, h:1123, mx:56, top:58, bottom:74};
const INK = {ink:'#17233b', muted:'#5b6880', line:'#d9e0ea', brand:'#0b2f66', accent:'#1c5fd0', zebra:'#f5f7fb', fill:'#eef3fa', good:'#24854a', warn:'#c76b16', bad:'#c23434', cust:'#0f6e60'};
const TONES = {good:['#e1f3e8','#1f7a43'], warn:['#fdecd8','#a85710'], bad:['#fbe1e1','#b02e2e'], info:['#e2ecfc','#1c56c0'], muted:['#edf0f4','#56627a'], cust:['#d9f0ec','#0f6e60']};
const RAGC = {good:'#2b9a55', warn:'#e8862a', bad:'#d23a3a'};
const FB = '"Figtree","Noto Sans Devanagari","Nirmala UI","Mangal","Segoe UI",system-ui,sans-serif';
const FDp = '"Outfit","Noto Sans Devanagari","Nirmala UI","Mangal","Segoe UI",system-ui,sans-serif';
const fnt = (w, s, disp) => `${w} ${s}px ${disp ? FDp : FB}`;
let _mc = null; const mctx = () => _mc || (_mc = document.createElement('canvas').getContext('2d'));
function measure(txt, f){ const c = mctx(); c.font = f; return c.measureText(txt).width; }
function wrap(text, f, maxW){
  const c = mctx(); c.font = f; const out = [];
  String(text ?? '').split('\n').forEach(par => {
    const words = par.split(/(\s+)/).filter(x => x !== ''); let line = '';
    for (const w of words){
      const test = line + w;
      if (c.measureText(test).width <= maxW){ line = test; continue; }
      if (line.trim()){ out.push(line.trimEnd()); line = w.trimStart(); }
      else line = '';
      if (c.measureText(line || w).width > maxW){ let chunk = ''; for (const ch of Array.from(line || w)){ if (c.measureText(chunk + ch).width > maxW && chunk){ out.push(chunk); chunk = ch; } else chunk += ch; } line = chunk; }
      else if (!line) line = w.trimStart();
    }
    out.push(line.trimEnd());
  });
  return out.length ? out : [''];
}
let _fontsOk = null;
function fontsReady(){
  if (_fontsOk) return _fontsOk;
  const loads = ['400','600','700'].flatMap(w => [document.fonts.load(fnt(w, 12), 'Ag'), document.fonts.load(`${w} 12px "Noto Sans Devanagari"`, 'अक'), document.fonts.load(fnt(w, 12, true), 'Ag')]);
  _fontsOk = Promise.race([Promise.all(loads).catch(() => {}), new Promise(r => setTimeout(r, 2500))]);
  return _fontsOk;
}
function rrect(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r, y); c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r); c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath(); }
function drawLines(c, lines, f, color, x, y, lh, align, w){
  c.font = f; c.fillStyle = color; c.textBaseline = 'alphabetic';
  lines.forEach((ln, i) => { const yy = y + i*lh + lh*0.74; if (align === 'r') { c.textAlign = 'right'; c.fillText(ln, x + w, yy); } else if (align === 'c') { c.textAlign = 'center'; c.fillText(ln, x + w/2, yy); } else { c.textAlign = 'left'; c.fillText(ln, x, yy); } });
  c.textAlign = 'left';
}
function chipW(txt){ return measure(txt, fnt(700, 9.5)) + 14; }
function drawChip(c, txt, tn, x, y){ const [bg, fg] = TONES[tn] || TONES.muted; const w = chipW(txt); c.fillStyle = bg; rrect(c, x, y, w, 18, 4); c.fill(); c.font = fnt(700, 9.5); c.fillStyle = fg; c.fillText(txt, x + 7, y + 12.8); return w; }

function letterhead(meta, W){
  const titleL = wrap(meta.title, fnt(700, 24, true), W), subL = wrap(meta.subtitle, fnt(500, 14), W);
  const cols = 3, cw = W / cols, rowsN = Math.ceil(meta.fields.length / cols);
  const fieldH = meta.fields.reduce((m, f) => Math.max(m, wrap(f[1], fnt(600, 11), cw - 14).length), 1) * 15 + 16;
  const h = 64 + titleL.length*30 + subL.length*20 + 14 + rowsN*fieldH + 22;
  return {h, draw(c, x, y){
    c.fillStyle = INK.brand; c.beginPath(); c.arc(x + 22, y + 22, 22, 0, Math.PI*2); c.fill();
    c.font = fnt(700, 14, true); c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText(meta.initials, x + 22, y + 27); c.textAlign = 'left';
    c.font = fnt(700, 13); c.fillStyle = INK.ink; c.fillText(meta.customer, x + 54, y + 19);
    c.font = fnt(400, 10.5); c.fillStyle = INK.muted; c.fillText(meta.brandSub, x + 54, y + 35);
    c.textAlign = 'right'; c.font = fnt(700, 10.5); c.fillStyle = INK.accent; try { c.letterSpacing = '1px'; } catch {}
    c.fillText(meta.docType.toLocaleUpperCase(LANGS[meta.l].loc), x + W, y + 17); try { c.letterSpacing = '0px'; } catch {}
    c.font = fnt(400, 10); c.fillStyle = INK.muted; c.fillText(meta.ref, x + W, y + 33);
    c.textAlign = 'left';
    let yy = y + 64;
    drawLines(c, titleL, fnt(700, 24, true), INK.brand, x, yy, 30); yy += titleL.length*30;
    drawLines(c, subL, fnt(500, 14), INK.muted, x, yy, 20); yy += subL.length*20 + 14;
    meta.fields.forEach((f, i) => {
      const cx = x + (i % cols) * cw, cy = yy + Math.floor(i / cols) * fieldH;
      c.fillStyle = INK.fill; rrect(c, cx, cy, cw - 8, fieldH - 6, 5); c.fill();
      c.font = fnt(600, 8.5); c.fillStyle = INK.muted; c.fillText(String(f[0]).toLocaleUpperCase(LANGS[meta.l].loc), cx + 8, cy + 14);
      drawLines(c, wrap(f[1], fnt(600, 11), cw - 24), fnt(600, 11), INK.ink, cx + 8, cy + 17, 15);
    });
    yy += rowsN*fieldH + 8;
    c.fillStyle = INK.brand; c.fillRect(x, yy, W, 2);
  }};
}
function blockLayout(b, W){
  if (b.type === 'h'){
    const lines = wrap(b.text, fnt(700, 15, true), W);
    return {h: 14 + lines.length*20 + 10, draw(c, x, y){ drawLines(c, lines, fnt(700, 15, true), INK.brand, x, y + 14, 20); c.fillStyle = INK.line; c.fillRect(x, y + 14 + lines.length*20 + 3, W, 1); }};
  }
  if (b.type === 'p'){
    const lines = wrap(b.text, fnt(400, 11.5), W);
    return {h: lines.length*17.5 + 6, draw(c, x, y){ drawLines(c, lines, fnt(400, 11.5), INK.ink, x, y, 17.5); }};
  }
  if (b.type === 'note'){

async function saveFile(name, data){

    try { await downloadsApi.save({filename: name, data}); toast(t('Downloaded {f}', {f:name})); }
    catch (e){ const c = e && e.code; if (c === 'declined') return; if (c === 'rate_limited') toast(t('Another download is waiting for your confirmation.')); else toast(t('This download is not available here.')); }
    return;
  }
  if (window.claude && !capsReady){ toast(t('Downloads are still starting. Try again in a moment.')); return; }
  try { const blob = data instanceof Blob ? data : new Blob([data]); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
  catch { toast(t('This download is not available here.')); }
}
async function produce(kind, fmtName, l, aud){
  const doc = (kind === 'status' || kind === 'finance' || kind === 'technical') ? buildDoc(kind, l, kind === 'technical' ? 'internal' : aud) : null;
  const sd = statusDate(), base = doc ? doc.meta.filename : `${slug(S.project.customer)}_${kind}_${l}_${sd}`;
  if (fmtName === 'pdf') return [base + '.pdf', await pdfFromDoc(doc)];
  if (fmtName === 'docx') return [base + '.docx', docxBytes(doc)];
  if (fmtName === 'xlsx'){

    if (kind === 'tasks') return [`${slug(S.project.customer)}_task_register_${l}_${sd}.xlsx`, taskWorkbook(l)];
    if (kind === 'risks') return [`${slug(S.project.customer)}_risk_register_${l}_${sd}.xlsx`, riskWorkbook(l)];

}
async function runDownload(btn, kind, fmtName, l, aud){

function parseAmount(s){
  const m = String(s).match(/(\d[\d\s.,]*)(\s*[kK])?/); if (!m) return null;
  let n = m[1].trim().replace(/\s/g, '');
  if (/^\d{1,3}([.,]\d{3})+$/.test(n)) n = n.replace(/[.,]/g, '');
  else n = n.replace(/,/g, '');
  let v = parseFloat(n); if (!isFinite(v)) return null; if (m[2]) v *= 1000; return v;
}
function localAnswer(text, bot){
  const q = String(text), low = q.toLowerCase(), R = F(lang), T = R.t, M = metrics(), P = phaseAgg().filter(p => !p.empty);
  const has = re => re.test(low);
  const tools = aiTools(bot), run = (i, inp) => { try { return tools[i].execute(inp); } catch (e){ return null; } };
  const done = () => '**' + T('Done.') + '**';
  const taskM = q.match(/\b[Tt]\s?(\d{1,3})\b/), riskM = q.match(/\b[Rr]\s?(\d{1,3})\b/);
  const rest = q.replace(/\b[TtRr]\s?\d{1,3}\b/g, ' ');
  const dateM = q.match(/\d{4}-\d{2}-\d{2}/);
  // ---- edits on a task
  if (taskM){
    const id = 'T' + taskM[1], x = S.tasks.find(k => k.id === id);
    if (!x) return T('I could not find task {id}.', {id});
    const inp = {id};
    const pctM = rest.match(/(\d{1,3})\s*%/) || (has(/progress|complete|avancement|प्रगति|पूर्ण/) ? rest.match(/\b(\d{1,3})\b/) : null);
    if (pctM && !has(/cost|coût|cout|लागत|खर्च|€|\$|£|₹/)) inp.pct = +pctM[1];
    if (has(/actual|réel|reel|spent|dépens|depens|वास्तविक|खर्च/) && has(/cost|coût|cout|लागत|खर्च|spent|dépens/)){ const v = parseAmount(rest); if (v != null) inp.actualCost = v; }
    else if (has(/planned|prévu|prevu|estimate|नियोजित/) && has(/cost|coût|cout|लागत/)){ const v = parseAmount(rest); if (v != null) inp.plannedCost = v; }
    const owner = S.owners.find(o => low.includes(o.toLowerCase()));
    if (owner && has(/assign|owner|responsable|attribu|जिम्मेदार|सौंप/)) inp.owner = owner;
    if (has(/unblock|débloqu|debloqu|अवरोध हटा/)) inp.blocked = false; else if (has(/\bblock|bloqu|अवरुद्ध/)) inp.blocked = true;
    if (dateM){ if (has(/start|début|debut|आरंभ|शुरू/)) inp.start = dateM[0]; else if (has(/end|fin|due|échéance|समाप्ति|नियत/)) inp.end = dateM[0]; }
    if (Object.keys(inp).length > 1){ const r = run(0, inp); return r ? done() : T('That change is not valid. Check the values and try again.'); }
    return T('Task {id} – {name}: {p} complete, {s}, {a} to {b}, owner {o}. Planned cost {c}, actual cost {ac}.', {id, name:x.name, p:R.pct(x.pct), s:T(statusOf(x)).toLowerCase() + (isOverdue(x) ? ' (' + T('Overdue').toLowerCase() + ')' : ''), a:R.date(x.start), b:R.date(x.end), o:x.owner, c:R.money(x.cost), ac:R.money(x.actual)});
  }
  // ---- edits on a risk
  if (riskM){
    const id = 'R' + riskM[1], r = S.risks.find(k => k.id === id);
    if (!r) return T('I could not find risk {id}.', {id});
    const inp = {id};
    if (has(/reopen|rouvr|फिर से खोल/)) inp.status = 'Open';
    else if (has(/close|clos|fermer|बंद/)) inp.status = 'Closed';
    else if (has(/mitigat|atténu|attenu|नियंत्रण/)) inp.status = 'Mitigating';
    if (has(/unshare|internal|interne|आंतरिक/)) inp.sharedWithCustomer = false; else if (has(/share|partag|साझा/)) inp.sharedWithCustomer = true;
    if (Object.keys(inp).length > 1){ run(2, inp); return done(); }
    return `**${r.id} ${r.title}** (${T(r.kind)}, ${T(r.status)})\n- ${T('Probability')}: ${T(r.probability)} · ${T('Impact')}: ${T(r.impact)} · ${T('Owner')}: ${r.owner}\n- ${T('Response')}: ${r.action}`;
  }
  // ---- budget change
  if (has(/budget|बजट/) && has(/change|set|update|increase|decrease|raise|modifi|passe|fixe|augment|rédui|बदल|कर दें|करें|बढ़ा|घटा/) && /\d/.test(q)){
    const v = parseAmount(q); if (v && v > 0){ run(1, {amount:v}); return done(); }
  }
  const bullets = arr => arr.map(s => '- ' + s).join('\n');
  // ---- customer disclosure
  if (has(/share|disclos|customer|client|partag|communiq|ग्राहक|साझा/)){
    return bullets([T('Share with customers: approved budget, spend to date, remaining budget, category totals and a high-level forecast when approved.'), T('Keep internal: task-level costs, supplier rates and invoices, salaries, margins, contingency and internal risk commentary.'), T('Send customers the customer copy of this report as PDF rather than the editable workbook.'), T('State the status date and the calculation basis on every figure you share.')])
      + '\n' + T('Use Reports → Customer copy to download a customer-safe PDF in English, French or Hindi.');
  }
  // ---- attention / overdue
  if (has(/attention|overdue|late|delay|behind|blocked|retard|bloqu|विलंब|देरी|ध्यान|पीछे/)){
    const sd = M.sd, out = [];
    if (M.overdue.length) out.push('**' + T('Overdue') + ':**', ...M.overdue.map(x => `- ${x.id} ${x.name} — ${R.pct(x.pct)}, ${T('Due date').toLowerCase()} ${R.dateS(x.end)} (${x.owner})`));
    const bl = S.tasks.filter(x => x.blocked && x.pct < 100); if (bl.length) out.push('**' + T('Blocked') + ':**', ...bl.map(x => `- ${x.id} ${x.name} (${x.owner})`));
    const soon = sortById(S.tasks.filter(x => x.pct < 100 && !isOverdue(x, sd) && D(x.end) >= D(sd) && days(sd, x.end) <= 7));
    if (soon.length) out.push('**' + T('Tasks ending in the next 7 days:') + '**', ...soon.map(x => `- ${x.id} ${x.name} — ${R.pct(x.pct)}, ${R.dateS(x.end)} (${x.owner})`));
    return out.length ? out.join('\n') : T('Nothing needs attention right now.');
  }
  // ---- risks
  if (has(/risk|issue|risque|problème|जोखिम|समस्या/)){
    const open = S.risks.filter(r => r.status !== 'Closed').sort((a,b) => sevScore(b) - sevScore(a));
    return open.length ? '**' + T('Open risks and issues:') + '**\n' + open.map(r => `- ${r.id} [${T(sevScore(r) >= 6 ? 'High' : sevScore(r) >= 3 ? 'Medium' : 'Low')}] ${r.title} — ${r.action}`).join('\n') : T('No open risks or issues to report.');
  }
  // ---- milestones
  if (has(/milestone|jalon|माइलस्टोन/)){
    return bullets(M.ms.map(m => { const [s] = msStatus(m, P, M.sd); return `${m.name} — ${R.date(m.date)} (${T(s)})`; }));
  }
  // ---- budget / cost
  if (has(/budget|cost|spend|money|financ|forecast|coût|cout|dépens|prévision|बजट|लागत|खर्च|वित्त|पूर्वानुमान/)){
    return T('As at {d}, {sp} has been spent against an approved budget of {b} ({pc}), and {r} remains. Work is {a} complete.', {d:R.date(M.sd), sp:R.money(M.AC), b:R.money(M.budget), pc:R.pct(M.spentPct), r:R.money(M.budget - M.AC), a:R.pct(M.actualPct)})
      + ' ' + T('At the current cost performance the project is forecast to finish at {f}.', {f:R.money(M.EAC)})
      + '\n' + bullets([`CPI ${R.n2(M.CPI)} — ${M.CPI >= 1 ? T('Under budget') : T('Over budget')}`, `SPI ${R.n2(M.SPI)} — ${M.SPI >= 1 ? T('On or ahead of schedule') : T('Behind schedule')}`, `${T('Variance at completion')}: ${R.money(M.VAC)}`]);
  }
  // ---- status / summary
  if (has(/status|summar|overview|progress|update|report|état|etat|résum|resum|synthèse|avancement|स्थिति|सारांश|प्रगति/)){
    return bullets(insightItems(M, phaseAgg(), lang, 'internal').map(i => i[1]));
  }
  return T('I can help with: project status, budget, what to share with the customer, tasks needing attention, risks and milestones. I can also make changes, for example “Change T4 progress to 80%”, “Set T8 actual cost to 7500”, “Assign T4 to Testing”, “Set the budget to 120000” or “Close R3”.');
}

let serverMode = null; // {role, rev} when running on the bundled server.py
async function initServerMode(){
  try {
    const r = await fetch('api/me', {cache:'no-store', credentials:'same-origin'});
    if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) return;
    const me = await r.json(); if (!me || !me.role) return;
    serverMode = me;
    const post = async (url, body, headers) => {
      const res = await fetch(url, {method:'POST', body, credentials:'same-origin', headers:Object.assign({'X-Requested-With':'ibpc'}, headers)});
      let j = null; try { j = await res.json(); } catch {}
      if (res.status === 401){ setTimeout(() => { location.href = 'login'; }, 1200); throw {code:'session_expired', message:'Signed out'}; }
      if (res.status === 403) throw {code:'not_writer'};
      if (res.status === 409){ setTimeout(() => location.reload(), 1500); throw {code:'conflict'}; }
      if (res.status === 413) throw {code:'too_large'};
      if (res.status === 415) throw {code:'unsupported_type'};
      if (!res.ok) throw {code:'upstream_error', message:(j && j.error) || res.statusText};
      return j;
    };
    if (me.role === 'editor'){
      artifactApi = {publish: async files => {
        const out = {}; for (const [k, v] of Object.entries(files)) out[k] = v == null || v.delete ? null : (typeof v === 'string' ? v : v.content);
        const j = await post('api/save', JSON.stringify({baseRev: serverMode.rev, files: out}), {'Content-Type':'application/json'});
        serverMode.rev = j.rev; return {version: String(j.rev)};
      }};
      assetsApi = {upload: async (blob, o) => post('api/upload', blob, {'Content-Type': (o && o.contentType) || blob.type || 'application/octet-stream'})};
    } else readOnly = true;
    if (me.storage === false && me.role === 'editor') setTimeout(() => toast(t('Saving is off until storage is connected. Add Upstash Redis in Vercel → Storage, then redeploy.')), 1500);
  } catch {}
}

function mdLite(s){
  const lines = esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split('\n');
  let html = '', inList = false;
  lines.forEach(ln => {
    const m = ln.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (m){ if (!inList){ html += '<ul>'; inList = true; } html += `<li>${m[1]}</li>`; return; }
    if (inList){ html += '</ul>'; inList = false; }
    if (ln.trim()) html += `<p>${ln.replace(/^#+\s*/, '')}</p>`;
  });
  if (inList) html += '</ul>';
  return html;
}

  if (window.claude && window.claude.use){
    const use = n => window.claude.use(n).catch(() => null);
    Promise.all([use('artifact'), use('downloads'), use('assets'), use('sample')]).then(async ([a, dl, as, sm]) => {
      artifactApi = a; downloadsApi = dl; assetsApi = as; sampleApi = sm;
      if (sm && sm.limits){ try { const lim = await sm.limits(); if (lim && 'tools' in lim && !lim.tools) ai.toolsOk = false; } catch {} }
      capsReady = true; if (['ai','documents'].includes(view)) renderAll();
    });
  } else initServerMode().finally(() => { capsReady = true; renderAll(); });
  window.__ib = {buildDoc, layoutDoc, drawPage, pdfFromDoc, docxBytes, financeWorkbook, taskWorkbook, riskWorkbook, setLang, setAudience, fontsReady};
})();

</script>
